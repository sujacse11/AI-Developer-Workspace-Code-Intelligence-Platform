databases:
  - name: ai-workspace-db
    databaseName: workspace_db
    user: workspace_user
    plan: free

services:
  # 1. Django REST Backend Service
  - type: web
    name: ai-workspace-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python seed_data.py
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workspace-db
          property: connectionString

  # 2. React Frontend Static Site
  - type: web
    name: ai-workspace-frontend
    env: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-workspace-backend
          property: host
